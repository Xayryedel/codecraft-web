<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KicksStore — Магазин кроссовок</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-hover: #1f1f1f;
            --border: #2a2a2a;
            --text: #f5f5f5;
            --muted: #888888;
            --accent: #e2e8f0;
            --accent-2: #cbd5e1;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .header-inner { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; text-transform: uppercase; }
        .logo span { color: var(--muted); }
        
        .cart-btn {
            background: var(--surface); border: 1px solid var(--border); color: var(--text);
            padding: 10px 20px; border-radius: 30px; font-weight: 600; font-size: 0.9rem;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; font-family: inherit;
        }
        .cart-btn:hover { background: var(--surface-hover); border-color: var(--accent); }
        .cart-count { background: var(--accent); color: var(--bg); padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; font-weight: 800; }

        .hero { padding: 80px 0 60px; text-align: center; }
        .hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; line-height: 1.1; margin-bottom: 20px; letter-spacing: -1.5px; }
        .hero p { color: var(--muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

        .filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 50px; flex-wrap: wrap; }
        .filter-btn {
            background: transparent; border: 1px solid var(--border); color: var(--muted);
            padding: 8px 24px; border-radius: 30px; font-weight: 600; font-size: 0.9rem;
            cursor: pointer; transition: 0.3s; font-family: inherit;
        }
        .filter-btn:hover { border-color: var(--accent); color: var(--text); }
        .filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-bottom: 80px; }
        .product-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px; cursor: pointer; transition: transform 0.3s, border-color 0.3s;
            display: flex; flex-direction: column; gap: 15px;
        }
        .product-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.2); }
        .product-img {
            background: var(--surface-hover); border-radius: 12px; height: 200px;
            display: flex; align-items: center; justify-content: center; font-size: 5rem; margin-bottom: 10px;
        }
        .product-brand { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .product-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; }
        .product-price { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-top: auto; }

        .modal {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
            width: 100%; max-width: 900px; display: flex; flex-direction: column; overflow: hidden;
            position: relative; transform: scale(0.95); transition: transform 0.3s; max-height: 90vh;
        }
        .modal.active .modal-content { transform: scale(1); }
        .close-modal {
            position: absolute; top: 20px; right: 20px; background: var(--surface-hover); border: none;
            color: var(--text); width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem;
            cursor: pointer; z-index: 10; transition: 0.2s;
        }
        .close-modal:hover { background: #ff4d4d; color: white; }

        @media (min-width: 768px) {
            .modal-content { flex-direction: row; }
            .modal-img-container { width: 50%; padding: 40px; display: flex; align-items: center; justify-content: center; background: var(--surface-hover); }
            .modal-info { width: 50%; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; }
        }

        .modal-img-container { padding: 20px; display: flex; align-items: center; justify-content: center; background: var(--surface-hover); overflow: hidden; position: relative; }
        .modal-img {
            font-size: 10rem; transition: transform 0.1s ease-out; cursor: crosshair;
            user-select: none; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
        }

        .modal-info { padding: 30px; display: flex; flex-direction: column; gap: 15px; }
        .modal-title { font-size: 2rem; font-weight: 800; }
        .modal-desc { color: var(--muted); font-size: 0.95rem; margin-bottom: 10px; }
        
        .option-label { font-size: 0.9rem; margin-top: 10px; margin-bottom: 5px; font-weight: 700; color: var(--text); }
        
        .color-selector { display: flex; gap: 10px; margin-bottom: 5px; }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; transition: 0.2s; }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.active { border-color: var(--accent); transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        .size-selector { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .size-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text);
            width: 45px; height: 45px; border-radius: 10px; font-weight: 600; cursor: pointer;
            transition: 0.2s; font-family: inherit;
        }
        .size-btn:hover { border-color: var(--accent); }
        .size-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        
        .add-to-cart-btn {
            background: var(--accent); color: var(--bg); padding: 16px; border: none;
            border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer;
            margin-top: auto; transition: 0.2s; font-family: inherit;
        }
        .add-to-cart-btn:hover { filter: brightness(0.9); }

        .cart-panel {
            position: fixed; top: 0; right: 0; width: 100%; max-width: 400px; height: 100%;
            background: var(--surface); border-left: 1px solid var(--border); z-index: 2000;
            padding: 30px; display: flex; flex-direction: column; transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        .cart-panel.active { transform: translateX(0); }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .cart-title { font-size: 1.5rem; font-weight: 800; }
        .cart-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .cart-item-info h4 { font-size: 1rem; }
        .cart-item-info p { font-size: 0.85rem; color: var(--muted); }
        .cart-item-price { font-weight: 700; color: var(--accent); }
        .cart-footer { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; }
        .checkout-btn { width: 100%; background: var(--accent); color: var(--bg); padding: 16px; border: none; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .checkout-btn:hover { filter: brightness(0.9); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1999; display: none; }
        .overlay.active { display: block; }

        @media (max-width: 768px) {
            .modal-img { font-size: 6rem; }
            .modal-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-inner">
            <div class="logo">Kicks<span>Store</span></div>
            <button class="cart-btn" onclick="toggleCart()">
                🛒 Корзина <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Твоя пара <br>уже здесь</h1>
            <p>Оригинальные кроссовки от мировых брендов. Быстрая доставка и гарантия качества.</p>
        </div>
    </section>

    <section class="container">
        <div class="filters" id="filters">
            <button class="filter-btn active" data-brand="all">Все</button>
            <button class="filter-btn" data-brand="Nike">Nike</button>
            <button class="filter-btn" data-brand="Adidas">Adidas</button>
            <button class="filter-btn" data-brand="Puma">Puma</button>
            <button class="filter-btn" data-brand="New Balance">New Balance</button>
        </div>

        <div class="grid" id="productGrid"></div>
    </section>

    <div class="modal" id="productModal" onclick="closeModalOnBg(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">✖</button>
            <div class="modal-img-container">
                <div class="modal-img" id="modalImg"></div>
            </div>
            <div class="modal-info">
                <div class="product-brand" id="modalBrand"></div>
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-desc" id="modalDesc"></p>
                <div class="product-price" id="modalPrice"></div>
                
                <div class="option-label">Цвет:</div>
                <div class="color-selector" id="colorSelector"></div>

                <div class="option-label">Выберите размер:</div>
                <div class="size-selector" id="sizeSelector"></div>
                
                <button class="add-to-cart-btn" onclick="addToCartFromModal()">Добавить в корзину</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <div class="cart-title">Корзина</div>
            <button class="close-modal" style="position: static;" onclick="toggleCart()">✖</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Итого:</span>
                <span id="cartTotal">0 ₽</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>

    <script>
        const products = [
            { 
                id: 1, brand: 'Nike', name: 'Air Max 270', price: 12990, icon: '👟', 
                desc: 'Максимальный комфорт и амортизация. Идеальны для города.', 
                sizes: [40, 41, 42, 43, 44],
                colors: ['#000000', '#ffffff', '#e11d48']
            },
            { 
                id: 2, brand: 'Adidas', name: 'Ultraboost 22', price: 15990, icon: '👟', 
                desc: 'Энергия в каждом шаге. Высокотехнологичная подошва.', 
                sizes: [39, 40, 41, 42, 43, 44, 45],
                colors: ['#ffffff', '#000000', '#3b82f6']
            },
            { 
                id: 3, brand: 'Puma', name: 'RS-X3 Puzzle', price: 9990, icon: '👟', 
                desc: 'Ретро-стиль 80-х в современной интерпретации.', 
                sizes: [40, 41, 42, 43, 44],
                colors: ['#e11d48', '#fbbf24', '#000000']
            },
            { 
                id: 4, brand: 'New Balance', name: '574 Classic', price: 11990, icon: '👟', 
                desc: 'Легендарная модель, которая никогда не выходит из моды.', 
                sizes: [38, 39, 40, 41, 42, 43, 44, 45],
                colors: ['#d1d5db', '#1e293b', '#84cc16']
            },
            { 
                id: 5, brand: 'Nike', name: 'Dunk Low Panda', price: 13990, icon: '👟', 
                desc: 'Культовая модель, вдохновленная баскетболом 80-х.', 
                sizes: [40, 41, 42, 43, 44, 45],
                colors: ['#ffffff', '#000000']
            },
            { 
                id: 6, brand: 'Adidas', name: 'Forum Low', price: 10990, icon: '👟', 
                desc: 'Баскетбольная классика с регулируемой застежкой.', 
                sizes: [39, 40, 41, 42, 43, 44],
                colors: ['#3b82f6', '#ffffff', '#000000']
            }
        ];

        let cart = [];
        let currentProduct = null;
        let selectedSize = null;
        let selectedColor = null;

        function renderProducts(brand = 'all') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            const filtered = brand === 'all' ? products : products.filter(p => p.brand === brand);

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(p.id);
                card.innerHTML = `
                    <div class="product-img">${p.icon}</div>
                    <div class="product-brand">${p.brand}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price} ₽</div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('filters').addEventListener('click', (e) => {
            if (!e.target.classList.contains('filter-btn')) return;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            renderProducts(e.target.dataset.brand);
        });

        function openModal(id) {
            currentProduct = products.find(p => p.id === id);
            selectedSize = null;
            selectedColor = null;

            document.getElementById('modalImg').textContent = currentProduct.icon;
            document.getElementById('modalImg').style.transform = 'scale(1)';
            document.getElementById('modalBrand').textContent = currentProduct.brand;
            document.getElementById('modalTitle').textContent = currentProduct.name;
            document.getElementById('modalDesc').textContent = currentProduct.desc;
            document.getElementById('modalPrice').textContent = `${currentProduct.price} ₽`;

            const colorSelector = document.getElementById('colorSelector');
            colorSelector.innerHTML = '';
            currentProduct.colors.forEach((color, index) => {
                const btn = document.createElement('button');
                btn.className = `color-btn ${index === 0 ? 'active' : ''}`;
                btn.style.backgroundColor = color;
                if (index === 0) selectedColor = color;
                
                btn.onclick = () => {
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedColor = color;
                };
                colorSelector.appendChild(btn);
            });

            const sizeSelector = document.getElementById('sizeSelector');
            sizeSelector.innerHTML = '';
            currentProduct.sizes.forEach(size => {
                const btn = document.createElement('button');
                btn.className = 'size-btn';
                btn.textContent = size;
                btn.onclick = () => {
                    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedSize = size;
                };
                sizeSelector.appendChild(btn);
            });

            document.getElementById('productModal').classList.add('active');
        }

        document.getElementById('modalImg').addEventListener('mousemove', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const xPercent = (x / rect.width) * 100;
            const yPercent = (y / rect.height) * 100;

            this.style.transformOrigin = `${xPercent}% ${yPercent}%`;
            this.style.transform = 'scale(2.5)';
        });

        document.getElementById('modalImg').addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
            this.style.transformOrigin = 'center center';
        });

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        function closeModalOnBg(event) {
            if (event.target.id === 'productModal') closeModal();
        }

        function addToCartFromModal() {
            if (!selectedSize) {
                alert('Пожалуйста, выберите размер!');
                return;
            }

            const existingItem = cart.find(item => 
                item.product.id === currentProduct.id && 
                item.size === selectedSize && 
                item.color === selectedColor
            );

            if (existingItem) {
                existingItem.qty++;
            } else {
                cart.push({ 
                    product: currentProduct, 
                    size: selectedSize, 
                    color: selectedColor, 
                    qty: 1 
                });
            }

            updateCart();
            closeModal();
            alert('Товар добавлен в корзину!');
        }

        function toggleCart() {
            document.getElementById('cartPanel').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function updateCart() {
            const cartItemsEl = document.getElementById('cartItems');
            const cartTotalEl = document.getElementById('cartTotal');
            const cartCountEl = document.getElementById('cartCount');

            cartItemsEl.innerHTML = '';
            
            if (cart.length === 0) {
                cartItemsEl.innerHTML = '<p style="color: var(--muted); text-align: center; margin-top: 20px;">Корзина пуста</p>';
                cartCountEl.textContent = '0';
                cartTotalEl.textContent = '0 ₽';
                return;
            }

            let total = 0;
            let count = 0;

            cart.forEach((item, index) => {
                total += item.product.price * item.qty;
                count += item.qty;

                const el = document.createElement('div');
                el.className = 'cart-item';
                el.innerHTML = `
                    <div class="cart-item-info">
                        <h4>${item.product.name}</h4>
                        <p>Размер: ${item.size} | Кол-во: ${item.qty}</p>
                        <div style="width: 15px; height: 15px; border-radius: 50%; background-color: ${item.color}; border: 1px solid #555; margin-top: 5px;"></div>
                    </div>
                    <div class="cart-item-price">${item.product.price * item.qty} ₽</div>
                    <button style="background:transparent; border:none; color:#ff4d4d; cursor:pointer; font-size:1.2rem;" onclick="removeFromCart(${index})">🗑️</button>
                `;
                cartItemsEl.appendChild(el);
            });

            cartCountEl.textContent = count;
            cartTotalEl.textContent = `${total} ₽`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function checkout() {
            if (cart.length === 0) return;
            alert('Заказ успешно оформлен!');
            cart = [];
            updateCart();
            toggleCart();
        }

        renderProducts();
        updateCart();
    </script>
</body>
</html>
